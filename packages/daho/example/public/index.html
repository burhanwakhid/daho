<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Static H2O Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            text-align: center;
            padding: 60px 20px;
            color: #333;
        }
        h1 { color: #2563eb; }
        p { font-size: 1.1em; color: #666; max-width: 500px; margin: 20px auto; }
        code { background: #e5e7eb; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>It works!</h1>
    <p>This page is served directly by the H2O kernel via zero-copy file serving &mdash; no Dart code involved.</p>
    <p>See <code>example/06_serving_static_files.dart</code> for how this works.</p>
</body>
</html>
