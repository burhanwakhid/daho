name: daho
description: >-
  A fast, minimal HTTP framework for Dart backed by a native H2O server
  over FFI, with an Express/Fiber-style API and multi-core support.
version: 0.1.1
homepage: https://burhanwakhid.github.io/daho/
repository: https://github.com/burhanwakhid/daho
issue_tracker: https://github.com/burhanwakhid/daho/issues
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  vm_service: ^15.2.0
  daho_auth:
    path: ../daho_auth
  clurit_daho:
    path: ../clurit_daho
