name: Benchmark

# Manual benchmark comparing Daho against two same-purpose baselines: Dart
# `shelf` (same language, no built-in clustering — manually clustered here via
# shared:true so it isn't a strawman single-core comparison) and Go Fiber
# (a commonly cited fast HTTP framework). All three serve an identical
# `/json` route with an identical response body, no logging/extra middleware
# on any of them. Daho and shelf are both AOT-compiled (`dart compile exe`)
# before benchmarking, the same way `linux-build-smoke-test.yml` compiles its
# own example, so neither Dart target has a JIT-vs-AOT disadvantage against
# Fiber's compiled Go binary. See packages/daho/benchmark/{shelf,fiber} for
# the comparison servers themselves.
on:
  # Manual run (only available once this file is on the default branch).
  workflow_dispatch:
    inputs:
      connections:
        description: "Concurrent keep-alive connections"
        default: "100"
      duration:
        description: "Load duration (seconds), per target"
        default: "15"
  # Also run on pull requests so the benchmark can be exercised from a feature
  # branch before it is merged to the default branch. Remove this if per-PR
  # benchmark runs become too noisy/expensive.
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install H2O, CMake and wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libh2o-evloop-dev cmake wrk

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Dart dependencies
        run: dart pub get

      - name: Install shelf comparison server dependencies
        working-directory: packages/daho/benchmark/shelf
        run: dart pub get

      - name: Build Daho native library
        run: |
          cd packages/daho/c_src
          mkdir -p build && cd build
          cmake ..
          cmake --build .

      # Same pattern as linux-build-smoke-test.yml's "Compile example AOT"
      # step: compiled (not `dart run`/JIT'd) into packages/daho/build/, run
      # with `working-directory: packages/daho` so Dart's own native-library
      # lookup (which walks up from the current working directory) finds
      # c_src/build without needing the package's source layout at runtime.
      - name: Compile Daho benchmark target (AOT)
        working-directory: packages/daho
        run: |
          mkdir -p build
          dart compile exe example/daho_example.dart -o build/daho_example
          file build/daho_example

      - name: Compile shelf benchmark target (AOT)
        working-directory: packages/daho/benchmark/shelf
        run: dart compile exe bin/server.dart -o bin/shelf_server_bin

      - name: Build Fiber comparison server
        working-directory: packages/daho/benchmark/fiber
        run: go build -o fiber_server .

      - name: Run comparison benchmark
        env:
          DAHO_PROFILE: "0"
        run: |
          # inputs are only set on workflow_dispatch; default them otherwise.
          CONN='${{ github.event.inputs.connections }}'; CONN="${CONN:-100}"
          DUR='${{ github.event.inputs.duration }}'; DUR="${DUR:-15}"
          CORES=$(nproc)

          echo "Cores: $CORES | connections: $CONN | duration: ${DUR}s per target"

          # Resident memory in MB for a PID, via /proc — framework-agnostic
          # (works identically for the Dart VM process running Daho/shelf and
          # for Fiber's Go binary), unlike each server self-reporting its own
          # RSS internally. Linux-only (matches ubuntu-latest); prints 0 if
          # /proc isn't available or the process already exited.
          get_rss_mb() {
            local pattern=$1
            local total_rss_kb=0
            
            # Cari semua PID yang command-nya cocok dengan pattern
            for p in $(pgrep -f "$pattern" || true); do
              if [ -f "/proc/$p/status" ]; then
                local rss=$(awk '/VmRSS/ {print $2}' "/proc/$p/status" 2>/dev/null)
                total_rss_kb=$((total_rss_kb + ${rss:-0}))
              fi
            done
            
            if [ "$total_rss_kb" -gt 0 ]; then
              awk -v rss="$total_rss_kb" 'BEGIN { printf "%.1f", rss/1024 }'
            else
              echo "0"
            fi
          }

          # Runs `wrk` against $1 (a name) at $2 (a port), writing results to
          # /tmp/wrk-$1.log and appending a Markdown row to /tmp/rows.md. $3
          # starts the server (backgrounded here). $4 is a plain substring
          # (not $3 itself, which may be a `(cd ... && ...)` subshell for
          # Daho's LD_LIBRARY_PATH/cwd needs) used to `pkill -f` every process
          # this target spawned, since killing just $3's own backgrounded PID
          # wouldn't reach a child process started inside a subshell.
          run_target() {
            local name="$1" port="$2" start_cmd="$3" kill_pattern="$4"
            echo "::group::$name"

            eval "$start_cmd" > "/tmp/server-$name.log" 2>&1 &
            local pid=$!

            local ready=""
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$port/json" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ -z "$ready" ]; then
              echo "$name never became ready:"
              cat "/tmp/server-$name.log"
              kill -9 "$pid" 2>/dev/null || true
              pkill -9 -f "$kill_pattern" 2>/dev/null || true
              echo "::endgroup::"
              return 1
            fi

            local rss_before=$(get_rss_mb "$kill_pattern")
            
            wrk -t"$CORES" -c"$CONN" -d"${DUR}s" --latency \
              "http://127.0.0.1:$port/json" > "/tmp/wrk-$name.log" 2>&1 || true

            local rss_after=$(get_rss_mb "$kill_pattern")

            kill -9 "$pid" 2>/dev/null || true
            pkill -9 -f "$kill_pattern" 2>/dev/null || true
            # Let the port free up before the next target binds it.
            sleep 2

            local rps=$(grep 'Requests/sec:' "/tmp/wrk-$name.log" | awk '{print $2}')
            local p50=$(grep -A4 'Latency Distribution' "/tmp/wrk-$name.log" | awk '/50%/{print $2}')
            local p99=$(grep -A4 'Latency Distribution' "/tmp/wrk-$name.log" | awk '/99%/{print $2}')
            local failed=$(grep 'Non-2xx or 3xx responses' "/tmp/wrk-$name.log" | grep -o '[0-9]*$')
            echo "| $name | ${rps:-n/a} | ${p50:-n/a} | ${p99:-n/a} | ${failed:-0} | ${rss_before:-n/a} -> ${rss_after:-n/a} |" >> /tmp/rows.md

            echo "::endgroup::"
          }

          rm -f /tmp/rows.md
          touch /tmp/rows.md

          run_target daho 8081 \
            '(cd packages/daho && export LD_LIBRARY_PATH=$PWD/c_src/build:$LD_LIBRARY_PATH && ./build/daho_example)' \
            'build/daho_example'
          run_target shelf 8082 \
            'packages/daho/benchmark/shelf/bin/shelf_server_bin' \
            'shelf_server_bin'
          run_target fiber 8083 \
            'packages/daho/benchmark/fiber/fiber_server' \
            'fiber_server'

          {
            echo "## Daho vs. shelf vs. Fiber (Linux, ubuntu-latest, $CORES cores)"
            echo "- RSS is read from \`/proc/\$pid/status\` via \`pgrep -f\`."
            echo "  This safely sums the memory of all matching processes, meaning"
            echo "  Fiber's Prefork child workers are fully accounted for in the total."
          } >> "$GITHUB_STEP_SUMMARY"

          cat /tmp/rows.md
